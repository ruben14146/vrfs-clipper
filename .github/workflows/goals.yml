name: VRFS goal clips (Replay Viewer)
# Goals are recorded with the standalone Replay Viewer (about 3x faster on these GPU-less machines than the game);
# 3-mans stay on Camera.exe + CasterCamMod (clips.yml). Same site, same queue, split by kind.
#
# 1. "plan" asks the site how to split the queued GOALS over up to 4 machines (empty queue = nothing runs).
# 2. Each machine gets the viewer (cached by its size on the site), records its share and uploads the clips.
#    The admin key is the MATCHSTATS_KEY secret and only ever lives in env vars.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Stop starting new clips after this many minutes'
        default: '50'
      machines:
        description: 'Most machines to record on at once'
        default: '4'
  schedule:
    - cron: '10,30,50 * * * *'   # safety net: picks up anything queued while nothing was running
permissions:
  contents: read
env:
  SITE: https://matchstats.rubenplayz.com
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shares: ${{ steps.plan.outputs.shares }}
      ver: ${{ steps.plan.outputs.ver }}
    steps:
      - id: plan
        env:
          KEY: ${{ secrets.MATCHSTATS_KEY }}
          MACHINES: ${{ github.event.inputs.machines || '4' }}
        run: |
          shares=$(curl -sf -H "x-admin-key: $KEY" "$SITE/api/clips/plan?kind=goals&machines=$MACHINES" || echo '[]')
          echo "shares=$shares" >> "$GITHUB_OUTPUT"
          echo "Replays per machine: $shares"
          # the viewer's size on the site = its version (a new upload invalidates the cache)
          ver=$(curl -sfI -H "x-admin-key: $KEY" "$SITE/api/clipper/replayviewer.zip" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          echo "ver=${ver:-0}" >> "$GITHUB_OUTPUT"

  clips:
    needs: plan
    if: needs.plan.outputs.shares != '[]' && needs.plan.outputs.shares != ''
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        codes: ${{ fromJSON(needs.plan.outputs.shares) }}
    steps:
      - name: Restore the Replay Viewer from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: C:\rv
          key: replayviewer-${{ needs.plan.outputs.ver }}

      - name: Download the Replay Viewer
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          KEY: ${{ secrets.MATCHSTATS_KEY }}
        run: |
          New-Item -ItemType Directory -Force C:\rv, C:\dl | Out-Null
          curl.exe -sSf --retry 5 -H "x-admin-key: $env:KEY" -o C:\dl\rv.zip "$env:SITE/api/clipper/replayviewer.zip"
          if ($LASTEXITCODE -ne 0) { throw "the viewer didn't download" }
          tar -xf C:\dl\rv.zip -C C:\rv
          Remove-Item C:\dl\rv.zip

      - name: Save the viewer to cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\rv
          key: replayviewer-${{ needs.plan.outputs.ver }}

      - name: Record this machine's goals
        shell: pwsh
        env:
          CCM_KEY: ${{ secrets.MATCHSTATS_KEY }}
          CCM_CODES: ${{ matrix.codes }}
          CCM_MAXMIN: ${{ github.event.inputs.minutes || '50' }}
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "couldn't set the resolution: $_" }
          $exe = Get-ChildItem C:\rv -Recurse -Filter VRFSReplay.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force C:\logs | Out-Null
          $a = @('-screen-width','1920','-screen-height','1080','-screen-fullscreen','0','-popupwindow','-force-d3d11','-logFile','C:\logs\player.log','-ci')
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $a -PassThru
          $limit = ([int]$env:CCM_MAXMIN + 25) * 60 * 1000
          if (-not $p.WaitForExit($limit)) { Write-Host "Viewer still running after the time limit - stopping it."; Stop-Process -Id $p.Id -Force }
          Select-String -Path C:\logs\player.log -Pattern '\[ci\]|\[clip\]|Exception' | ForEach-Object { $_.Line }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal-run-logs-${{ strategy.job-index }}
          retention-days: 3
          path: C:\logs
